name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Check formatting
        run: moon fmt --check
      - name: Check package
        run: moon check --target ${{ matrix.target }} --deny-warn
      - name: Run tests
        run: moon test --target ${{ matrix.target }} --deny-warn
      - name: Verify public interfaces
        run: |
          moon info
          git diff --exit-code -- src/audit/pkg.generated.mbti src/wire/pkg.generated.mbti

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Check partial coverage
        run: |
          moon run src/cli --target js samples/diamond/bom.cdx.json samples/diamond/findings.json samples/diamond/partial.openvex.json > partial.json
          node -e 'const d=require("./partial.json").decisions[0]; if(d.outcome!=="Incomplete" || d.paths.length!==2 || d.paths[0].statement_ids.length!==1 || d.paths[1].statement_ids.length!==0) process.exit(1)'
      - name: Check complete coverage
        run: |
          moon run src/cli --target js samples/diamond/bom.cdx.json samples/diamond/findings.json samples/diamond/complete.openvex.json > complete.json
          node -e 'const r=require("./complete.json"); if(r.decisions[0].outcome!=="NotAffected" || r.decisions[0].statement_ids.length!==2) process.exit(1)'
      - name: Check unrelated cyclic branch
        run: |
          moon run src/cli --target js --require-clear samples/diamond/unrelated-cycle.cdx.json samples/diamond/findings.json samples/diamond/complete.openvex.json > unrelated-cycle.json
          node -e 'const d=require("./unrelated-cycle.json").decisions[0]; if(d.outcome!=="NotAffected" || d.paths.length!==2 || d.paths.some(p=>p.bom_refs.some(ref=>ref.startsWith("unrelated-")))) process.exit(1)'
      - name: Check statement history
        run: |
          moon run src/cli --target js samples/diamond/bom.cdx.json samples/diamond/findings.json samples/diamond/history.openvex.json > history.json
          node -e 'const d=require("./history.json").decisions[0]; if(d.outcome!=="Fixed" || d.statement_ids.length!==1 || d.paths.some(p=>p.superseded_statement_ids.length!==1)) process.exit(1)'
      - name: Check Trivy import
        run: |
          moon run src/cli --target js --trivy samples/diamond/bom.cdx.json samples/diamond/trivy.json samples/diamond/partial.openvex.json > trivy-audit.json
          node -e 'const r=require("./trivy-audit.json"); if(r.decisions.length!==1 || r.decisions[0].finding_id!=="Results[0].Vulnerabilities[0]" || r.decisions[0].outcome!=="Incomplete" || r.unresolved.length!==1 || r.unresolved[0].row!=="Results[0].Vulnerabilities[1]") process.exit(1)'
      - name: Check CI gate and retained reports
        run: |
          moon run src/cli --target js --require-clear samples/diamond/bom.cdx.json samples/diamond/findings.json samples/diamond/complete.openvex.json > clear-gate.json
          node -e 'const r=require("./clear-gate.json"); if(r.decisions[0].outcome!=="NotAffected") process.exit(1)'
          if moon run src/cli --target js --require-clear samples/diamond/bom.cdx.json samples/diamond/findings.json samples/diamond/partial.openvex.json > partial-gate.json; then exit 1; fi
          node -e 'const r=require("./partial-gate.json"); if(r.decisions[0].outcome!=="Incomplete") process.exit(1)'
          if moon run src/cli --target js --trivy --require-clear samples/diamond/bom.cdx.json samples/diamond/trivy.json samples/diamond/complete.openvex.json > unresolved-gate.json; then exit 1; fi
          node -e 'const r=require("./unresolved-gate.json"); if(r.decisions[0].outcome!=="NotAffected" || r.unresolved.length!==1) process.exit(1)'
